name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fia
          POSTGRES_PASSWORD: fia
          POSTGRES_DB: fia_test
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U fia -d fia_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://fia:fia@localhost:5443/fia_test
      VITE_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Mensajes de commit (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: Ningún .env real versionado
        run: |
          if git ls-files | grep -E '(^|/)(\.env(\..+)?|.+\.env)$' | grep -vE '(^|/)\.env\.example$'; then
            echo "Se encontró un archivo .env versionado" && exit 1
          fi
      - run: pnpm skills:check
      - run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes
          path: |
            coverage/
            **/reports/mutation/
          retention-days: 7
